<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · AuditMate</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>
:root{color-scheme:dark;--muted:#929caf;--accent:#8b5cf6}*{box-sizing:border-box}body{background:radial-gradient(ellipse at 15% 10%,#21183d 0,transparent 38%),radial-gradient(ellipse at 90% 90%,#0c3038 0,transparent 32%),#090b10;min-height:100vh;display:grid;place-items:center;font-family:Inter,system-ui,sans-serif;color:#eef2f8;padding:1rem}.box{background:#11151dee;border:1px solid #2a3040;border-radius:20px;padding:clamp(1.5rem,4vw,2.4rem);width:min(430px,94vw);box-shadow:0 25px 90px #0008;backdrop-filter:blur(12px)}.brandmark{width:46px;height:46px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(135deg,#7c3aed,#0891b2);font-size:1.35rem;margin-bottom:1.25rem}h2{font-weight:800;letter-spacing:-.04em;color:#fff}.sub{color:var(--muted)}.form-label{font-size:.86rem;font-weight:650;color:#cbd3e1}.form-control{background:#0b0e14;border:1px solid #303849;color:#fff;border-radius:9px;min-height:44px}.form-control:focus{background:#0b0e14;color:#fff;border-color:var(--accent);box-shadow:0 0 0 .2rem #8b5cf626}.btn-primary{background:linear-gradient(135deg,#7c3aed,#6366f1);border:0;border-radius:9px;min-height:44px;font-weight:700}.text-secondary{color:var(--muted)!important}
</style></head><body><div class="box"><div class="brandmark">🛡</div><h2>AuditMate</h2><p class="sub mb-4">Security controls. Risk visibility. Clear action.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-danger">{{message}}</div>{% endfor %}{% endwith %}<form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label class="form-label">Username</label><input class="form-control mb-3" name="username" required autocomplete="username" placeholder="Enter username"><label class="form-label">Password</label><input class="form-control mb-4" name="password" type="password" required autocomplete="current-password" placeholder="Enter password"><button class="btn btn-primary w-100">Sign in <span aria-hidden="true">→</span></button></form><div class="small text-secondary mt-4">Local demo only · Change default credentials before use.</div></div></body></html>
